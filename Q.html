<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questy</title>

    <link rel="stylesheet" href="Q.css">

    <style>
        h1 {
            margin: 0 0 20px;
            font-size: 2.5rem;
            text-align: center;
            color: #eaeaf2;
            text-shadow:
                -1px -1px 0 #000,
                 1px -1px 0 #000,
                -1px  1px 0 #000,
                 1px  1px 0 #000;
        }
    </style>
</head>

<body>

    <h1>Hello! I'm Questy</h1>

    <div id="chatbox">
        <div id="chat"></div>

        <input
            type="text"
            id="userInput"
            placeholder="Type your message..."
            onkeypress="if(event.key==='Enter') sendMessage()">

        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        // Replace with your own API key
        const apiKey = "YOUR_API_KEY_HERE";

        const apiUrl =
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + apiKey;

        let conversationHistory = [];

        function escapeHTML(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const chat = document.getElementById("chat");

            const userInput = input.value.trim();

            if (!userInput) return;

            conversationHistory.push({
                role: "client",
                text: userInput
            });

            chat.innerHTML += `
                <p><strong>You:</strong> ${escapeHTML(userInput)}</p>
            `;

            input.value = "";

            const conversationText = conversationHistory
                .map(entry => `${entry.role}: ${entry.text}`)
                .join("\n");

            const payload = {
                contents: [{
                    parts: [{
                        text: `You are Questy, my sarcastic but caring AI study companion and project buddy.

${conversationText}

assistant:

Reply in plain text without any prefixes.`
                    }]
                }]
            };

            try {

                const response = await fetch(apiUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();

                const reply =
                    data.candidates?.[0]?.content?.parts?.[0]?.text ||
                    "I couldn't generate a response.";

                conversationHistory.push({
                    role: "assistant",
                    text: reply
                });

                chat.innerHTML += `
                    <p><strong>Questy:</strong> ${escapeHTML(reply)}</p>
                `;

                chat.scrollTop = chat.scrollHeight;

            } catch (error) {

                console.error(error);

                chat.innerHTML += `
                    <p><strong>Questy:</strong> Something went wrong. Please try again later.</p>
                `;
            }
        }
    </script>

</body>

</html>
